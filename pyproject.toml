[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "humana-ea-copilot"
version = "0.1.0"
description = "Governed executive time-management copilot prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.5",
  "httpx==0.28.1",
  "mcp==1.29.0",
  "ortools==9.14.6206",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.50",
  "uvicorn==0.32.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "playwright==1.60.0",
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["requires_tenant: requires a signed-in Microsoft 365 tenant"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ea_copilot"]
